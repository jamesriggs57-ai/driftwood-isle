<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Driftwood Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff8ea; --cream2:#f7e8c9; --line:#e7d1a6; --brown:#5b4332; --brown2:#8b6b50;
  --leaf:#7cc35a; --leafd:#4f9a3a; --peach:#f3a072; --sky:#7fd3e8; --red:#e2604d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
img,svg,canvas{-webkit-user-drag:none;user-drag:none}
html,body{position:fixed;inset:0;width:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.pb,.bbody,#netBody,#morePop{touch-action:pan-y}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd8e8;font-family:'Fredoka',system-ui,sans-serif;color:var(--brown);touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#grade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(255,240,210,0) 55%,rgba(255,226,180,.10) 75%,rgba(70,50,80,.22) 100%);mix-blend-mode:multiply}
.layer{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px)}
.pill{pointer-events:auto;background:var(--cream);border:3px solid var(--line);border-radius:22px;box-shadow:0 4px 0 rgba(91,67,50,.18),0 8px 20px rgba(0,0,0,.12);padding:8px 14px}
#clock{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 10px);display:flex;align-items:center;gap:10px}
#clock .t{font-size:26px;font-weight:700;line-height:1}
#clock .d{font-size:13px;color:var(--brown2);font-weight:500;line-height:1.25}
#clock svg{width:30px;height:30px;flex:none}
#money{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:calc(env(safe-area-inset-right) + 10px);display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700}
#money svg{width:26px;height:26px}
#bar{position:absolute;top:calc(env(safe-area-inset-top) + 66px);right:calc(env(safe-area-inset-right) + 10px);display:flex;gap:8px}
#bar .rbtn{width:52px;height:52px;font-size:10px}
#bar .rbtn svg{width:22px;height:22px}
.rbtn{pointer-events:auto;width:58px;height:58px;border-radius:50%;background:var(--cream);border:3px solid var(--line);box-shadow:0 4px 0 rgba(91,67,50,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;color:var(--brown);font-size:11px;font-weight:600;padding:0;transition:transform .08s}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(91,67,50,.22)}
.rbtn svg{width:26px;height:26px;margin-bottom:1px}
#act{position:absolute;width:96px;pointer-events:auto;min-width:96px;height:96px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 40% 35%,#9ee27a,#5fae43);color:#fff;font-family:inherit;font-weight:700;font-size:18px;box-shadow:0 5px 0 #3f8a2f,0 10px 24px rgba(0,0,0,.2);cursor:pointer;display:none;text-shadow:0 2px 0 rgba(0,0,0,.18);padding:0 10px}
#act:active{transform:translateY(4px);box-shadow:0 1px 0 #3f8a2f}
#act.show{display:block;animation:pop .22s ease-out}
#toolBtn{position:absolute;pointer-events:auto;width:56px;height:56px;border-radius:50%;background:var(--cream);border:3px solid var(--line);box-shadow:0 4px 0 rgba(91,67,50,.22);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
#toolBtn img,#toolBtn svg{width:40px;height:40px}
#toolPop{position:fixed;display:none;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--cream);border:3px solid var(--line);border-radius:22px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:auto;z-index:12}
#toolPop.show{display:flex}
.tp{position:relative;width:74px;border:3px solid var(--line);background:#fff;border-radius:16px;padding:4px 2px 8px;font-family:inherit;font-size:11px;font-weight:600;color:var(--brown);display:flex;flex-direction:column;align-items:center;cursor:pointer;overflow:hidden}
.tp img,.tp svg{width:42px;height:42px}
.tp.on{border-color:#3a2a22;background:#fff4d2}
.tp i{position:absolute;left:0;bottom:0;height:4px;background:var(--leaf)}
#layoutBar{position:absolute;top:calc(env(safe-area-inset-top) + 130px);left:50%;transform:translateX(-50%);display:none;pointer-events:auto;text-align:center;width:min(92vw,420px)}
#layoutBar.show{display:block}
#layoutBar .btn{margin:6px 4px 0}
#hud.layout #joyZone{outline:3px dashed #fff;outline-offset:4px;border-radius:50%;cursor:move}
#hud.layout #act{outline:3px dashed #fff;outline-offset:6px;cursor:move;display:block}
#hud.layout #toolBtn,#hud.layout #bar,#hud.layout #hint{visibility:hidden}
#fade{position:fixed;inset:0;background:#1e1612;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
/* v1.3: the wizard's spell reloads the island behind a lilac shimmer */
#magicVeil{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;transition:opacity .6s ease;background:radial-gradient(ellipse at 50% 45%,#f4ecff 0%,#cdb8f0 38%,#7a62b8 100%);overflow:hidden}
#magicVeil i{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,255,255,.9);animation:mvTw 1.6s ease-in-out infinite}
@keyframes mvTw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.4)}}
html.magicret #magicVeil{opacity:1;pointer-events:auto}
html.magicret #start{visibility:hidden}
#fade.show{opacity:1}
@keyframes pop{0%{transform:scale(.6)}80%{transform:scale(1.06)}100%{transform:scale(1)}}
#toasts{position:absolute;top:calc(env(safe-area-inset-top) + 128px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{background:rgba(255,248,234,.96);border:3px solid var(--line);border-radius:18px;padding:8px 16px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.12);animation:tin .3s ease-out;display:flex;align-items:center;gap:10px;max-width:88vw}
.toast img{width:36px;height:36px}
.toast.new{border-color:#f3c35a;background:#fff4d2}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:none}}
#joyZone{position:absolute;pointer-events:auto;touch-action:none}
#joyBase{position:absolute;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(91,67,50,.15),inset 0 0 18px rgba(255,255,255,.25);transform:translate(-50%,-50%);pointer-events:none;transition:opacity .15s}
#joyKnob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;background:rgba(255,255,255,.85);border:3px solid rgba(255,255,255,1);box-shadow:0 3px 8px rgba(0,0,0,.18);transform:translate(-50%,-50%)}
.uihide #joyZone,.uihide #act,.uihide #toolBtn{visibility:hidden}
#hint{position:absolute;top:calc(env(safe-area-inset-top) + 128px);left:0;right:0;text-align:center;color:#fff;font-weight:600;font-size:14px;text-shadow:0 2px 6px rgba(0,0,0,.35);transition:opacity 1s}
/* panels */
#scrim{position:fixed;inset:0;background:rgba(40,30,20,.28);display:none;pointer-events:auto;align-items:center;justify-content:center;padding:16px;z-index:20}
#scrim.show{display:flex}
#scrim.top{align-items:flex-start;background:rgba(40,30,20,.18)}
#scrim.top .panel{max-height:58vh}
#hud.menuprev{z-index:21}
#hud.menuprev #joyZone{pointer-events:none}
#hud.menuprev #act,#hud.menuprev #toolBtn,#hud.menuprev #bar,#hud.menuprev #clock,#hud.menuprev #money,#hud.menuprev #toasts,#hud.menuprev #hint{visibility:hidden}
#hud.menuprev *{pointer-events:none!important}
.panel{background:var(--cream);border:4px solid var(--line);border-radius:28px;width:min(560px,100%);max-height:min(86vh,760px);display:flex;flex-direction:column;box-shadow:0 8px 0 rgba(91,67,50,.2),0 20px 50px rgba(0,0,0,.25);animation:pin .22s ease-out;overflow:hidden}
@keyframes pin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;background:var(--cream2);border-bottom:3px solid var(--line)}
.ph h2{margin:0;font-size:22px;font-weight:700}
.x{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);background:#fff;color:var(--brown);font-size:20px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1}
.pb{padding:14px 16px 18px;overflow:auto;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:3px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-family:inherit;font-weight:600;font-size:14px;color:var(--brown2);cursor:pointer}
.tab.on{background:var(--leaf);border-color:var(--leafd);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slot{position:relative;aspect-ratio:1;background:#fff;border:3px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.slot img{width:78%;height:78%;object-fit:contain;pointer-events:none}
.slot .n{position:absolute;right:5px;bottom:2px;font-weight:700;font-size:13px;background:var(--cream2);border-radius:9px;padding:0 6px}
.slot.empty{background:#fbf2df;cursor:default}
.slot.sel{border:4px solid #3a2a22;box-shadow:0 0 0 3px rgba(58,42,34,.18);transform:scale(1.04)}
.slot.unk img{filter:brightness(0);opacity:.18}
.slot .nm{position:absolute;left:4px;right:4px;bottom:3px;font-size:10px;text-align:center;font-weight:600;line-height:1.1}
.row{display:flex;align-items:center;gap:12px;padding:8px;border:3px solid var(--line);background:#fff;border-radius:18px;margin-bottom:8px}
.row img{width:56px;height:56px}
.row .grow{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:16px}
.row .sub{font-size:13px;color:var(--brown2)}
.btn{border:3px solid var(--leafd);background:var(--leaf);color:#fff;font-family:inherit;font-weight:700;font-size:15px;border-radius:16px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 var(--leafd)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--leafd)}
.btn.alt{background:#fff;color:var(--brown);border-color:var(--line);box-shadow:0 3px 0 var(--line)}
.btn.warn{background:var(--red);border-color:#b24534;box-shadow:0 3px 0 #b24534}
.btn:disabled{opacity:.45;pointer-events:none}
.pf{border-top:3px solid var(--line);background:var(--cream2);padding:10px 12px calc(10px + env(safe-area-inset-bottom));flex:none}
.detail{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.detail img{width:60px;height:60px;flex:none}
.detail .grow{flex:1;min-width:120px}
.detail .nm{font-weight:700;font-size:17px}
.detail .sub{font-size:13px;color:var(--brown2)}
.detail .acts{display:flex;gap:6px;flex-wrap:wrap}
.rar{display:inline-block;color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px;vertical-align:1px}
.toast .sub{font-size:13px;font-weight:500;color:var(--brown2);margin-top:2px}
.bar{height:16px;background:#f1e2c2;border-radius:10px;overflow:hidden;border:2px solid var(--line)}
.bar>div{height:100%;background:linear-gradient(90deg,#8fd66a,#5fae43)}
.muted{color:var(--brown2);font-size:14px}
.notice{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;font-size:15px}
label.f{display:block;font-weight:600;margin:10px 0 4px}
input[type=text]{width:100%;font-family:inherit;font-size:18px;padding:10px 12px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--brown);outline:none;user-select:text;-webkit-user-select:text}
input[type=range]{width:100%}
select{font-family:inherit;font-size:16px;padding:6px;border-radius:10px;border:3px solid var(--line);background:#fff;color:var(--brown)}
/* dialogue */
#dlg{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);display:none;justify-content:center;padding:0 12px;z-index:15;pointer-events:none}
#dlg.show{display:flex}
#dlgBox{pointer-events:auto;position:relative;width:min(620px,100%);background:var(--cream);border:4px solid var(--line);border-radius:30px;padding:26px 22px 18px;min-height:120px;font-size:19px;line-height:1.4;box-shadow:0 8px 0 rgba(91,67,50,.2),0 16px 40px rgba(0,0,0,.2);cursor:pointer;animation:pin .2s}
#dlgName{position:absolute;top:-20px;left:22px;background:var(--peach);color:#fff;font-weight:700;padding:5px 16px;border-radius:16px;font-size:17px;border:3px solid #fff;transform:rotate(-2deg)}
#dlgMore{position:absolute;right:20px;bottom:8px;font-size:16px;color:var(--peach);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#dlgChoices{position:absolute;right:16px;bottom:calc(100% + 10px);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#dlgChoices .btn{min-width:150px}
/* place bar */
#placeBar{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;display:none;justify-content:center;gap:10px;pointer-events:none}
#placeBar.show{display:flex}
#placeBar .btn{pointer-events:auto;font-size:17px;padding:12px 18px}
/* placement, catch meter */
#placeBar .btn.rot{font-size:24px;padding:6px 14px;line-height:1}
#meter{position:fixed;transform:translate(-50%,-100%);display:none;pointer-events:none;z-index:14;width:180px}
#meter.show{display:block}
#meter .trk{position:relative;height:18px;border-radius:10px;background:rgba(255,248,234,.95);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.25);overflow:hidden}
#meter .ok,#meter .great,#meter .perfect{position:absolute;top:0;bottom:0}
#meter .ok{background:#f3d9a0}#meter .great{background:#9ad27a}#meter .perfect{background:#f3c35a}
#meter .mk{position:absolute;top:-3px;bottom:-3px;width:4px;margin-left:-2px;background:#3a2a22;border-radius:2px}
.floatTxt{position:fixed;transform:translate(-50%,-50%);font-weight:700;font-size:22px;color:#fff;text-shadow:0 2px 0 #5b4332,0 0 8px rgba(0,0,0,.4);pointer-events:none;z-index:16;animation:fup 1.1s ease-out forwards}
@keyframes fup{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-160%)}}
/* build mode */
#hud.building #bar,#hud.building #joyZone,#hud.building #act,#hud.building #toolBtn,#hud.building #hint,#hud.building #clock{visibility:hidden}
#build{position:fixed;left:0;right:0;bottom:0;height:min(58vh,600px);display:none;flex-direction:column;background:var(--cream);border-top:4px solid var(--line);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);z-index:22;padding-bottom:env(safe-area-inset-bottom)}
#build.show{display:flex}
#build .bhead{padding:10px 14px 4px;display:flex;flex-direction:column;gap:2px}
#build .bhead .tabs{margin-bottom:0}
#build .bbody{flex:1;overflow:auto;padding:6px 14px 10px;-webkit-overflow-scrolling:touch}
#build .bfoot{display:flex;gap:8px;align-items:center;padding:8px 14px;border-top:3px solid var(--line);background:var(--cream2)}
#build .bfoot #bMsg{flex:1;font-size:13px;line-height:1.2}
#bp{display:block;margin:0 auto;touch-action:none;border-radius:14px;background:#e8f2d8;border:3px solid var(--line)}
.bsec{margin:10px 0 4px}.bsec>b{display:block;font-size:14px;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:3px solid var(--line);background:#fff;border-radius:14px;padding:5px 11px;font-family:inherit;font-weight:600;font-size:13px;color:var(--brown);cursor:pointer}
.chip.on{background:var(--leaf);border-color:var(--leafd);color:#fff}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px #3a2a22}
.brow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
/* start */
#start{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,rgba(127,211,232,.55),rgba(255,226,181,.65));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#start .panel{text-align:center}
#start h1{margin:4px 0 0;font-size:40px;color:var(--brown);letter-spacing:.5px}
#start .tag{color:var(--brown2);margin:2px 0 14px}
#start .btn{font-size:20px;padding:12px 28px;margin-top:16px}
#loading{font-size:14px;color:var(--brown2);margin-top:10px}
.hide{display:none!important}

/* online: boot screens, friends panel, banner */
#bootUI{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,#9fdcec,#ffe2b5)}
#bootUI .panel{text-align:left}
#bootUI input,#netPanel input,#netPanel select{width:100%;box-sizing:border-box;font-family:inherit;font-size:16px;padding:8px 10px;border:3px solid var(--line);border-radius:12px;background:#fff;margin-bottom:4px}
.layoutCard{display:block;width:100%;text-align:left;font-family:inherit;background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 12px;margin:0 0 8px;cursor:pointer;color:var(--brown)}
.layoutCard b{display:block;font-size:17px}.layoutCard span{font-size:14px;color:var(--brown2)}
.layoutCard:active{border-color:var(--leafd)}
#netPanel{position:fixed;inset:0;z-index:30;background:rgba(40,30,20,.28);display:none;align-items:flex-end;justify-content:center}
#netPanel.show{display:flex}
#netPanel .sheet{background:var(--cream);border:4px solid var(--line);border-radius:28px 28px 0 0;width:min(560px,100%);max-height:82vh;display:flex;flex-direction:column}
#netPanel .head{display:flex;align-items:center;gap:6px;padding:10px 12px 6px}#netTabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
#netBanner span{flex:1}
#netPanel .x,#netBanner .x{border:3px solid var(--line);background:#fff;border-radius:12px;font-family:inherit;font-weight:700;color:var(--brown);width:36px;height:36px;cursor:pointer}
#netBody{padding:6px 14px 18px;overflow:auto;-webkit-overflow-scrolling:touch}
#netBody .row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 10px;margin:6px 0}
#netBody .row .it{display:flex;gap:8px;align-items:center}#netBody .row img{width:40px;height:40px}
#netBody .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px;margin:6px 0 10px}
#netBody .grid .slot{flex-direction:column;font-size:11px;text-align:center;padding:4px;aspect-ratio:auto;min-height:74px}#netBody .grid .slot img{width:44px;height:44px}
#netBody .grid .slot.on{border-color:var(--leafd);background:#e8f6dc}
#netBody .emotes{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.btn.sm{font-size:13px;padding:5px 10px;border-radius:12px}
.notice.warn{border-color:#e0a060;background:#fff6e8}
.copyRow{display:flex;gap:6px;margin-top:8px}.copyRow input{flex:1}
#netBanner{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 130px);width:min(480px,90vw);box-sizing:border-box;z-index:25;display:none;align-items:center;gap:8px;background:var(--cream);border:3px solid var(--line);border-radius:16px;padding:8px 10px;font-size:14px;box-shadow:0 4px 0 rgba(91,67,50,.25)}
#dlgChoices .btn.sel{outline:4px solid var(--leafd);outline-offset:2px;transform:scale(1.04)}
/* house style unlocks */
.chip.locked{opacity:.75;border-style:dashed}
.chip .lk{display:block;font-size:10px;color:var(--brown2);font-weight:600}
.sw.locked{position:relative;opacity:.55}
.sw.locked::after{content:'';position:absolute;inset:30%;border-radius:3px;background:rgba(255,255,255,.85);box-shadow:0 0 0 2px rgba(91,67,50,.5)}
#unlockBar{background:#fff6e8;border:3px solid #e0a060;border-radius:14px;padding:8px 10px;margin:4px 0 8px;font-size:14px}
.rbtn.on{background:#e8f6dc;border-color:var(--leafd)}
/* condensed top bar on phones: the rarely used buttons live under More */
#bMore{display:none}
body.compact #bMore{display:flex;position:relative}
#morePop{position:absolute;top:calc(env(safe-area-inset-top) + 124px);right:calc(env(safe-area-inset-right) + 10px);display:none;flex-direction:column;gap:6px;padding:8px;background:var(--cream);border:3px solid var(--line);border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.18);pointer-events:auto;z-index:13;max-height:calc(100% - 140px);overflow:auto}
#morePop.show{display:flex;animation:pin .15s ease-out}
#morePop .rbtn{width:auto;min-width:150px;height:44px;border-radius:14px;flex-direction:row;justify-content:flex-start;gap:10px;padding:0 12px;font-size:15px;box-shadow:0 2px 0 rgba(91,67,50,.18)}
#morePop .rbtn svg{width:24px;height:24px;margin:0}
#bMore .dot,#morePop .dot{position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff}
#hud.building #morePop,#hud.magic #morePop,#hud.menuprev #morePop{display:none}
/* small pickup notes in the corner instead of big banners */
#picks{position:absolute;top:calc(env(safe-area-inset-top) + 72px);left:calc(env(safe-area-inset-left) + 10px);display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none}
.pick{display:flex;align-items:center;gap:6px;background:rgba(255,248,234,.9);border:2px solid var(--line);border-radius:14px;padding:2px 10px 2px 4px;font-size:13px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.1);animation:pkin .2s ease-out;transition:opacity .35s,transform .35s}
.pick img{width:24px;height:24px}
.pick b{color:var(--leafd)}
.pick.out{opacity:0;transform:translateX(-12px)}
@keyframes pkin{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
/* phones: smaller, lower-profile toasts */
@media (max-width:640px),(max-height:500px){
  #toasts{top:auto;bottom:calc(env(safe-area-inset-bottom) + 182px);gap:4px}
  .toast{font-size:13px;padding:5px 12px;border-width:2px;border-radius:14px;gap:8px;max-width:76vw}
  .toast img{width:26px;height:26px}
  .toast .sub{font-size:12px}
  #hint{top:auto;bottom:calc(env(safe-area-inset-bottom) + 150px)}
}
@media (max-height:500px){ #toasts{bottom:calc(env(safe-area-inset-bottom) + 120px)} #hint{bottom:calc(env(safe-area-inset-bottom) + 96px)} #picks{top:calc(env(safe-area-inset-top) + 62px)} }
/* home goods preview banner in the builder */
#tryBar{background:#eef7ff;border:3px solid #7ab0d8;border-radius:14px;padding:8px 10px;margin:4px 0 8px;font-size:14px}
.hgsw{width:56px;height:56px;border-radius:14px;border:3px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-align:center;line-height:1.1;background:#fff;color:var(--brown2)}
</style>
<script>try{ if (sessionStorage.getItem('dw-magic')) document.documentElement.classList.add('magicret'); }catch(e){}</script>

<body>
<canvas id="c" tabindex="0"></canvas>
<div id="grade" aria-hidden="true"></div>

<div class="layer" id="hud">
  <div id="clock" class="pill"><span id="wIcon"></span><div><div class="t" id="tTime">--:--</div><div class="d" id="tDate"></div></div></div>

    <button class="rbtn" id="bBook"><svg viewBox="0 0 32 32"><path d="M5 7c4-2 8-2 11 1v18c-3-3-7-3-11-1z" fill="#9ad3c9" stroke="#3f7f78" stroke-width="2"/><path d="M27 7c-4-2-8-2-11 1v18c3-3 7-3 11-1z" fill="#b7e3dc" stroke="#3f7f78" stroke-width="2"/></svg>Book</button>
    <button class="rbtn" id="bCraft" style="display:none"><svg viewBox="0 0 32 32"><path d="M6 24l11-11" stroke="#8b6b50" stroke-width="3.4" stroke-linecap="round"/><path d="M14 8l5-3 8 8-3 5z" fill="#c9cdd2" stroke="#6a6e74" stroke-width="2" stroke-linejoin="round"/><rect x="4" y="25" width="24" height="3" rx="1.5" fill="#e9b77d" stroke="#8b6b50" stroke-width="1.6"/></svg>Craft</button>
    <button class="rbtn" id="bBuild" style="display:none"><svg viewBox="0 0 32 32"><path d="M5 15 16 6l11 9" fill="none" stroke="#8b6b50" stroke-width="2.6" stroke-linejoin="round"/><path d="M8 13v13h16V13" fill="#f6dcb4" stroke="#8b6b50" stroke-width="2.2"/><rect x="13" y="18" width="6" height="8" fill="#e0745a" stroke="#8b6b50" stroke-width="1.6"/><path d="M22 4l6 6-2 2-6-6z" fill="#c9cdd2" stroke="#6a6e74" stroke-width="1.4"/></svg>Build</button>
    <button class="rbtn" id="bMore" aria-label="More"><svg viewBox="0 0 32 32"><circle cx="8" cy="16" r="3" fill="#8b6b50"/><circle cx="16" cy="16" r="3" fill="#8b6b50"/><circle cx="24" cy="16" r="3" fill="#8b6b50"/></svg>More</button>
    <button class="rbtn" id="bMenu"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="5" fill="none" stroke="#8b6b50" stroke-width="2.4"/><path d="M16 4v4M16 24v4M4 16h4M24 16h4M7.5 7.5l2.8 2.8M21.7 21.7l2.8 2.8M7.5 24.5l2.8-2.8M21.7 10.3l2.8-2.8" stroke="#8b6b50" stroke-width="2.4" stroke-linecap="round"/></svg>Menu</button>
  </div>
  <div id="morePop"></div>
  <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <button id="toolBtn" aria-label="Tools"></button>
  <button id="act">Act</button>
  <div id="layoutBar" class="pill"><b>Drag the joystick and the action button</b><br><span class="muted">Put them wherever feels right for your thumbs.</span><br><button class="btn alt" id="lReset">Reset</button><button class="btn" id="lDone">Done</button></div>
  <div id="toolPop"></div>
  <div id="placeBar"><button class="btn alt rot" id="pRotL" aria-label="Turn left">&#10226;</button><button class="btn alt rot" id="pRotR" aria-label="Turn right">&#10227;</button><button class="btn" id="pOk">Place</button><button class="btn alt" id="pNo">Cancel</button></div>
  <div id="meter"><div class="trk"><div class="ok"></div><div class="great"></div><div class="perfect"></div><div class="mk"></div></div></div>
</div>

<div id="dlg"><div id="dlgBox"><div id="dlgName"></div><div id="dlgText"></div><div id="dlgMore">&#9660;</div><div id="dlgChoices"></div></div></div>

<div id="scrim"><div class="panel"><div class="ph"><h2 id="pTitle"></h2><button class="x" id="pClose">&times;</button></div><div class="pb" id="pBody"></div><div class="pf" id="pFoot"></div></div></div>
<div id="fade"></div>

<div id="build"><div class="bhead"><div class="tabs" id="bTabs"><button class="tab" data-bt="layout">Layout</button><button class="tab" data-bt="ext">Outside</button><button class="tab" data-bt="int">Inside</button></div><div id="bCost" class="muted"></div></div>
  <div class="bbody" id="bBody"></div>
  <div class="bfoot"><span id="bMsg" class="muted"></span><button class="btn alt" id="bCancel">Cancel</button><button class="btn" id="bDone">Done</button></div></div>

<div id="start"><div class="panel"><div class="pb">
  <h1>Driftwood Isle</h1>

  <div id="newForm">
    <label class="f">Your name</label><input type="text" id="inName" maxlength="14" placeholder="e.g. Sam">

</div></div></div>
