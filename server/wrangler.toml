name = "driftwood-isle"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Where the game is reachable. Deploying replaces any routes set in the dashboard, so every one is listed here.
# - vinatix.com/driftwood*: the game's home on the Vinatix site. A route wins over a custom domain on the same host.
# - vinatix.com: TEMPORARY. Keeps the game at the root until the Vinatix hub takes over the domain.
#   At cutover: delete this line and deploy, then deploy the hub with vinatix.com as its custom domain.
routes = [
  { pattern = "vinatix.com/driftwood*", zone_name = "vinatix.com" },
  { pattern = "vinatix.com", custom_domain = true },
]

# The game files are served as static assets; /api/* goes to the Worker.
[assets]
directory = "../client"
binding = "ASSETS"
run_worker_first = ["/api/*", "/driftwood", "/driftwood/*"]

[[d1_databases]]
binding = "DB"
database_name = "driftwood"
database_id = "90b54329-03f1-412d-bcd5-f06dfcfd973a"

[durable_objects]
bindings = [{ name = "ROOMS", class_name = "IslandRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IslandRoom"]

[vars]
# Shown as the sender of sign-in emails. Must be an address on a domain you verified with Resend.
MAIL_FROM = "Driftwood Isle <hello@mail.vinatix.com>"
# Secrets (set with `npx wrangler secret put NAME`, never put them here):
#   RESEND_API_KEY  - without it, sign-in links are returned to the browser instead of emailed (dev only)
#   DEV_LOGIN       - set to "1" only for local testing to allow that
